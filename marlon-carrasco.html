<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marlon Carrasco</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #101a36, #174b78);
    }
    main {
      width: min(90%, 520px);
      padding: 48px 32px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 22px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 8vw, 3.5rem); }
    p { margin: 0; color: #dce8f8; font-size: 1.1rem; }
    .line { width: 70px; height: 4px; margin: 24px auto 0; border-radius: 4px; background: #55c7ff; }
  </style>
</head>
<body>
  <main>
    <h1>Marlon Carrasco</h1>
    <p>¡Bienvenido a mi página web!</p>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
